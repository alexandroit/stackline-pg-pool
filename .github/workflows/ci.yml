name: Release gates

on:
  push:
    branches: [main]
    tags: ['stackline-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pg-pool-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} / PostgreSQL ${{ matrix.postgres }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { node: '16', postgres: '18' }
          - { node: '18', postgres: '18' }
          - { node: '20', postgres: '18' }
          - { node: '22', postgres: '18' }
          - { node: '24', postgres: '18' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: stackline_pg_test
          POSTGRES_PASSWORD: stackline_pg_test
          POSTGRES_DB: stackline_pg_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: stackline_pg_test
      PGPASSWORD: stackline_pg_test
      PGDATABASE: stackline_pg_test
      TEST_SKIP_NATIVE: 'true'
      NO_UPDATE_NOTIFIER: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Verify clean source install
        run: |
          npm ci --ignore-scripts
          npm ls --all
          npm audit --audit-level=low
      - name: Install PostgreSQL test fixture
        run: npm install --no-save --package-lock=false --ignore-scripts pg@8.23.0
      - name: Run upstream and Stackline contracts
        run: npm test
      - name: Verify package metadata
        run: npm run check:package
      - name: Verify packed consumers
        run: npm run test:smoke
      - name: Inspect packed inventory
        run: npm run pack:check
      - name: Lint the exact tarball
        if: matrix.node == '24'
        run: |
          archive=$(npm pack --silent --ignore-scripts)
          npx --yes publint@0.3.24 "$archive" --strict

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2
